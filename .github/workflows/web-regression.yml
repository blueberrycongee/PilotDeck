name: Web Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Web/Gateway dependencies only
        run: pnpm install --frozen-lockfile --filter pilotdeck --filter pilotdeck-ui

      - name: Build Gateway and Web UI
        run: pnpm run build:web

      - name: Test Web UI and server
        # Playwright E2E files run separately from Vitest.
        # Desktop Smoke runs both updater suites with desktop dependencies.
        run: >-
          pnpm --dir ui exec vitest run
          --exclude 'e2e/**'
          --exclude 'server/services/desktopUpdateNetwork.test.ts'
          --exclude 'server/services/desktopUpdates.spec.ts'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pilotdeck:web-regression
