packages:
  - 'apps/desktop'
  - 'ui'

# Security updates for transitive dependencies. Keep each dependency on its
# current major/API line; entries without a compatible upstream fix are tracked
# in docs/architecture/dependency-security.md.
overrides:
  'axios@>=1.0.0 <1.20.0': '1.20.0'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'brace-expansion@>=1.0.0 <1.1.21': '1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'ip-address@>=10.0.0 <10.7.1': '10.7.1'
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  'nanoid@>=5.0.0 <5.1.16': '5.1.16'
  'postcss@>=8.0.0 <8.5.23': '8.5.23'
  'undici@>=7.0.0 <7.29.1': '7.29.1'
  '@grpc/grpc-js@>=1.0.0 <1.14.5': '1.14.5'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'proxy-addr@>=2.0.0 <2.0.8': '2.0.8'
  'prismjs@>=1.0.0 <1.30.0': '1.30.0'
  'esbuild@0.28.0': '0.28.1'
  'protobufjs@>=7.0.0 <7.6.5': '7.6.5'
  'body-parser@>=1.0.0 <1.20.6': '1.20.6'
  'dompurify@>=3.0.0 <3.4.16': '3.4.16'
  'react-router@>=6.0.0 <6.30.4': '6.30.4'
  '@remix-run/router@>=1.0.0 <1.23.3': '1.23.3'
  'mermaid@>=11.0.0 <11.16.1': '11.16.1'
  'postcss-selector-parser@>=6.0.0 <6.1.3': '6.1.3'
  'qs@>=6.0.0 <6.16.0': '6.16.0'

allowBuilds:
  '@google/genai': true
  bcrypt: true
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Native/build-time packages that are allowed to run lifecycle scripts during
# pnpm install. Keeping this at the workspace root makes Docker/CI installs
# deterministic and prevents ERR_PNPM_IGNORED_BUILDS failures.
onlyBuiltDependencies:
  - '@google/genai'
  - bcrypt
  - better-sqlite3
  - electron-winstaller
  - esbuild
  - node-pty
  - protobufjs
  - sharp
  - unrs-resolver
